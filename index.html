<style>
:root{--bg:#f3f3fb;--c:#fff;--t:#1b1b2f;--m:#7a7a95;--p:#5b4bdb;--l:#e6e6f3;--g:#12a36b;--r:#e5484d;--y:#f5a524;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10101c;--c:#1a1a2b;--t:#f0f0fa;--m:#9494b0;--p:#8b7dff;--l:#2a2a40}}
:root[data-theme="dark"]{--bg:#10101c;--c:#1a1a2b;--t:#f0f0fa;--m:#9494b0;--p:#8b7dff;--l:#2a2a40}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:auto;padding:14px 14px 150px}
.hero{background:linear-gradient(135deg,#5b4bdb,#7c5cff 55%,#14b8c4);color:#fff;border-radius:24px;padding:20px;margin-bottom:12px}
.hero small{opacity:.8}.hero .n{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:2px 0 12px}
.hero .two{display:flex;gap:10px}.hero .two div{flex:1;background:#ffffff26;border-radius:14px;padding:10px}.hero .two b{display:block;font-size:16px}
.card{background:var(--c);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px #5b4bdb14}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.m{color:var(--m);font-size:13px}.pos{color:var(--g)}.neg{color:var(--r)}
h3{margin:16px 2px 8px;font-size:16px}
.mb{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mb button{background:var(--c);border:0;color:var(--t);width:38px;height:38px;border-radius:50%;font-size:18px}
.mb b{text-transform:capitalize}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--l)}.tx:last-child{border:0}.tx .g{flex:1;min-width:0}.tx .g div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--l);border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--p);border-radius:8px}
.tag{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--l);color:var(--m)}.tag.y{background:#f5a52433;color:#b7791f}.tag.r{background:#e5484d26;color:var(--r)}.tag.g{background:#12a36b26;color:var(--g)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--p);color:#fff;font:inherit;font-weight:700;margin-top:8px}.btn.d{background:#e5484d1f;color:var(--r)}
.sm{border:0;background:var(--p);color:#fff;border-radius:10px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600}.sm.o{background:var(--l);color:var(--t)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--c);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 14px #0000001a;z-index:5}
.nav button{background:none;border:0;color:var(--m);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 8px}.nav button span{font-size:20px}.nav .on{color:var(--p);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#5b4bdb,#14b8c4);color:#fff;font-size:32px;box-shadow:0 6px 18px #5b4bdb66;z-index:6}
#sh{display:none;position:fixed;inset:0;z-index:20}.bg{position:absolute;inset:0;background:#0007}
.pn{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--c);border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--l);border-radius:12px;background:var(--bg);color:var(--t);font:inherit;font-size:16px;margin:4px 0 8px}
.big{font-size:32px;font-weight:800;text-align:center;border:0}
label{font-size:13px;color:var(--m)}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:8px}.seg button{flex:1;border:0;background:none;color:var(--m);padding:10px;border-radius:11px;font:inherit;font-weight:600}.seg .on{background:var(--p);color:#fff}
.chip{display:inline-block;background:var(--l);border-radius:20px;padding:5px 12px;margin:3px;font-size:13px}
#to{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#1b1b2f;color:#fff;padding:10px 18px;border-radius:20px;z-index:30;display:none}
.cd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.empty{text-align:center;color:var(--m);padding:26px 10px}
